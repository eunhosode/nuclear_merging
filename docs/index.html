<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nuclear_merging</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f4f8;
      color: #111827;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      display: grid;
      gap: 12px;
      justify-items: center;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    canvas {
      display: block;
      width: min(800px, calc(100vw - 24px), calc((100svh - 90px) * 4 / 3));
      height: auto;
      aspect-ratio: 4 / 3;
      background: #ffffff;
      border: 1px solid #c7ced8;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.16);
      touch-action: none;
      user-select: none;
    }

    .game-frame {
      position: relative;
    }

    .name-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(242, 244, 248, 0.92);
      border: 1px solid #c7ced8;
    }

    .name-form {
      width: min(360px, calc(100vw - 48px));
      display: grid;
      gap: 12px;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #c7ced8;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.16);
    }

    .name-form label {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
    }

    .name-form input,
    .name-form button {
      width: 100%;
      height: 44px;
      font: inherit;
    }

    .name-form input {
      padding: 0 12px;
      border: 1px solid #9ca3af;
    }

    .name-form button {
      border: 1px solid #374151;
      background: #111827;
      color: #ffffff;
      cursor: pointer;
    }

    .name-screen.hidden {
      display: none;
    }

    .mobile-controls {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    .mobile-control {
      position: absolute;
      bottom: 14px;
      width: 92px;
      height: 92px;
      border: 2px solid rgba(17, 24, 39, 0.65);
      background: rgba(255, 255, 255, 0.72);
      color: #111827;
      font-size: 44px;
      font-weight: 700;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    .mobile-control.left {
      left: 14px;
    }

    .mobile-control.right {
      right: 14px;
    }

    body.mobile-mode .mobile-controls.active {
      display: block;
    }
  </style>
</head>

    function getAtomicRadius(protons) {
      for (const [periodStart, periodEnd, largestRadius, shrinkPerElement] of atomicRadiusRules) {

          const position = protons - periodStart;
          const radius = largestRadius - position * shrinkPerElement;
          const lower = Math.floor(radius);
          // Match Python's round(), which rounds half-integers to the nearest even integer.

      const total = weights.reduce((sum, weight) => sum + weight, 0);
      let roll = Math.random() * total;
      for (let i = 0; i < items.length; i++) {
        roll -= weights[i];
        if (roll < 0) return items[i];
      }
      return items[items.length - 1];

      ctx.lineWidth = 2;
      ctx.strokeRect(button.x, button.y, button.w, button.h);
      drawCenteredText(button.label, button.x + button.w / 2, button.y + button.h / 2, 24);
    }

    function drawCircle(x, y, radius, color) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function isInsideButton(x, y, button) {
      return x >= button.x && x <= button.x + button.w && y >= button.y && y <= button.y + button.h;
    }

    function getCanvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
      };
    }

    function detectControlMode() {
      const hasTouch = navigator.maxTouchPoints > 0;
      const hasCoarsePointer = window.matchMedia("(pointer: coarse)").matches;
      const canHover = window.matchMedia("(hover: hover)").matches;

      if ((hasTouch || hasCoarsePointer) && !canHover) return "mobile";
      if (!hasTouch && !hasCoarsePointer && canHover) return "pc";
      return "";
    }

    function setControlMode(mode) {
      controlMode = mode;
      document.body.classList.toggle("mobile-mode", controlMode === "mobile");
      mobileControls.setAttribute("aria-hidden", controlMode === "mobile" ? "false" : "true");
      keys.clear();
    }

    function setMobileControlsActive(isActive) {
      mobileControls.classList.toggle("active", controlMode === "mobile" && isActive);
    }

    function resetGame(levelName) {
      selectedLevel = levels[levelName];
      selectedLevelName = levelName;
      player = createPlayer();
      particles = [];
      frameCount = 0;
      accumulatedTime = 0;
      gameOverIsotope = "";
      gameStartedAt = performance.now();
      gameOverElapsedSeconds = 0;
      nextParalysisCheckAt = performance.now() + (selectedLevel.paralysisInterval ?? 10000);
      paralysisUntil = 0;
      gameState = "playing";
      setMobileControlsActive(true);
    }

    function triggerGameOver() {
      gameOverIsotope = getIsotopeLabel(player.protons, player.neutrons);
      gameOverElapsedSeconds = Math.floor((performance.now() - gameStartedAt) / 1000);
      keys.clear();
      gameState = "game_over_menu";
      setMobileControlsActive(false);
      gameOverMenuStartedAt = performance.now();
    }

    function spawnParticles() {
      let px = randomInt(20, width - 20);
      const ptype = weightedChoice(["proton", "neutron", "photon"], selectedLevel.weights);

      if (ptype === "photon") {
        for (let i = 0; i < getPhotonCount(player.protons); i++) {
          if (["Choking", "Miserable", "Midgley's Gas", "Permian"].includes(selectedLevelName)) {
            px = randomInt(20, width - 20);
          } else {
            px = Math.max(20, Math.min(width - 20, player.x + randomInt(-60, 60)));
          }
          particles.push({ x: px, y: 0, type: ptype });
        }
      } else {
        const particle = { x: px, y: 0, type: ptype };
        if (ptype === "neutron" && Math.random() < (selectedLevel.neutronDecayChance ?? 0)) {
          particle.vanishY = randomInt(Math.floor(height / 4), Math.floor(height / 2));
        } else if (ptype === "proton" && Math.random() < (selectedLevel.protonDecayChance ?? 0)) {
          particle.vanishY = randomInt(Math.floor(height / 4), Math.floor(height / 2));
        }
        particles.push(particle);
      }
    }

    function updatePlaying() {
      const now = performance.now();
      if (selectedLevel.paralysis && now >= nextParalysisCheckAt) {
        nextParalysisCheckAt = now + (selectedLevel.paralysisInterval ?? 10000);
        if (Math.random() < (selectedLevel.paralysisChance ?? 0.5)) {
          paralysisUntil = now + (selectedLevel.paralysisDuration ?? 3000);
        }
      }

      const isParalyzed = selectedLevel.paralysis && now < paralysisUntil;
      if (!isParalyzed) {
        if ((keys.has("ArrowLeft") || keys.has("KeyA") || keys.has("MobileLeft")) && player.x - player.radius > 0) {
          player.x -= 5;
        }
        if ((keys.has("ArrowRight") || keys.has("KeyD") || keys.has("MobileRight")) && player.x + player.radius < width) {
          player.x += 5;
        }
      }

      if (frameCount % particleInterval === 0) {
        spawnParticles();
      }

      for (const particle of particles) {
        const defaultSpeed = particle.type === "photon" ? selectedLevel.photonSpeed : selectedLevel.particleSpeed;
        particle.y += particle.speed ?? defaultSpeed;
      }

      const newParticles = [];
      for (const particle of particles) {
        if (particle.y - 10 > height) continue;
        if (particle.vanishY !== undefined && particle.y >= particle.vanishY) {
          const decayAction = selectedLevel[`${particle.type}Decay`];
          if (decayAction === "photon") {
            particle.type = "photon";
            particle.speed = selectedLevel.photonSpeed;
            delete particle.vanishY;
          } else if (decayAction === "proton" || decayAction === "neutron") {
            particle.type = decayAction;
            delete particle.speed;
            delete particle.vanishY;
          } else {
            continue;
          }
        }

        const dist = Math.hypot(particle.x - player.x, particle.y - player.y);
        if (dist < player.radius + 10) {
          if (particle.type === "photon") {
            triggerGameOver();
            break;
          }

          if (particle.type === "proton") {
            player.protons += 1;
            player.radius = getAtomicRadius(player.protons);
          } else {
            player.neutrons += 1;
          }

          const z = player.protons;
          const a = player.protons + player.neutrons;
          const decayLevel = isotopeDecayLevels[`${z},${a}`] ?? 5;
          if (Math.random() < decayChances[decayLevel]) {
            triggerGameOver();
            break;
          }
        } else {
          newParticles.push(particle);
        }
      }
      particles = newParticles;
    }

    function drawMenu() {
      clearScreen();
      drawCenteredText("Select Level", width / 2, height / 4, 52);
      for (const button of levelButtons) {
        drawButton(button);
      }
    }

    function drawNameInput() {
      clearScreen();
      drawCenteredText("Enter Player Name", width / 2, height / 2 - 30, 52);
      drawCenteredText("Type your name and press Start.", width / 2, height / 2 + 35, 22, DARK_GRAY);
    }

    function drawModeSelect() {
      clearScreen();
      drawCenteredText("Select Device", width / 2, height / 2 - 90, 52);
      drawCenteredText("Choose once for this game.", width / 2, height / 2 - 35, 22, DARK_GRAY);
      drawButton(pcModeButton);
      drawButton(mobileModeButton);
    }

    function drawGameOverSummary() {
      clearScreen();
      drawCenteredText("GAME OVER", width / 2, height / 3 - 95, 48);
      drawCenteredText(`Player: ${playerName}`, width / 2, height / 3 - 40, 34);
      drawCenteredText(selectedLevelName, width / 2, height / 3 + 10, 42);
      drawCenteredText(gameOverIsotope, width / 2, height / 3 + 62, 42);
      drawCenteredText(getTimeLabel(gameOverElapsedSeconds), width / 2, height / 3 + 112, 42);
      drawButton(restartButton);
      drawButton(otherModeButton);
    }

    function drawPlaying() {
      clearScreen();
      drawCircle(player.x, player.y, player.radius, RED);

      for (const particle of particles) {
        const color = particle.type === "proton" ? RED : particle.type === "neutron" ? BLUE : GREEN;
        drawCircle(particle.x, particle.y, 10, color);
      }

      if (selectedLevel.fog) {
        ctx.fillStyle = FOG_GRAY;
        ctx.fillRect(0, height / 4, width, height / 2);
      }

      const massNumber = player.protons + player.neutrons;
      drawLeftText(getIsotopeLabel(player.protons, player.neutrons), 10, 10, 24);
      drawLeftText(`Mass Number: ${massNumber}`, 10, 40, 24);
      drawLeftText(`Mode: ${selectedLevelName}`, 10, 70, 24);
      if (selectedLevel.paralysis && performance.now() < paralysisUntil) {
        drawLeftText("Paralyzed", 10, 100, 24);
      }
    }

    function gameLoop(timestamp) {
      if (!lastFrameAt) lastFrameAt = timestamp;
      const elapsed = Math.min(timestamp - lastFrameAt, maxFrameMs);
      lastFrameAt = timestamp;
      accumulatedTime += elapsed;

      while (accumulatedTime >= targetFrameMs) {
        frameCount += 1;

        if (gameState === "playing") {
          updatePlaying();
        } else if (gameState === "game_over_menu") {
          if (performance.now() - gameOverMenuStartedAt >= 10000) {
            selectedLevel = null;
            selectedLevelName = "";
            particles = [];
            gameOverIsotope = "";
            gameOverElapsedSeconds = 0;
            nextParalysisCheckAt = 0;
            paralysisUntil = 0;
            gameState = "menu";
            setMobileControlsActive(false);
          }
        }

        accumulatedTime -= targetFrameMs;
      }

      if (gameState === "name_input") {
        drawNameInput();
      } else if (gameState === "mode_select") {
        drawModeSelect();
      } else if (gameState === "menu") {
        drawMenu();
      } else if (gameState === "playing") {
        drawPlaying();
      } else if (gameState === "game_over_menu") {
        drawGameOverSummary();
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("keydown", (event) => {
      if (gameState !== "playing" || controlMode !== "pc") return;
      if (["ArrowLeft", "ArrowRight", "KeyA", "KeyD"].includes(event.code)) {
        event.preventDefault();
        keys.add(event.code);
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    playerNameForm.addEventListener("submit", (event) => {
      event.preventDefault();
      playerName = playerNameInput.value.trim() || "Player";
      playerNameScreen.classList.add("hidden");
      const detectedMode = detectControlMode();
      if (detectedMode) {
        setControlMode(detectedMode);
        gameState = "menu";
      } else {
        gameState = "mode_select";
      }
    });

    function bindMobileMoveButton(button, keyName) {
      button.addEventListener("pointerdown", (event) => {
        if (controlMode !== "mobile" || gameState !== "playing") return;
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        keys.add(keyName);
      });

      button.addEventListener("pointerup", (event) => {
        if (button.hasPointerCapture(event.pointerId)) {
          button.releasePointerCapture(event.pointerId);
        }
        keys.delete(keyName);
      });

      button.addEventListener("pointercancel", () => {
        keys.delete(keyName);
      });

      button.addEventListener("lostpointercapture", () => {
        keys.delete(keyName);
      });
    }

    bindMobileMoveButton(moveLeftButton, "MobileLeft");
    bindMobileMoveButton(moveRightButton, "MobileRight");

    canvas.addEventListener("click", (event) => {
      const { x, y } = getCanvasPoint(event);

      if (gameState === "mode_select") {
        if (isInsideButton(x, y, pcModeButton)) {
          setControlMode("pc");
          gameState = "menu";
        } else if (isInsideButton(x, y, mobileModeButton)) {
          setControlMode("mobile");
          gameState = "menu";
        }
      } else if (gameState === "menu") {
        for (const button of levelButtons) {
          if (isInsideButton(x, y, button)) {
            resetGame(button.label);
            return;
          }
        }
      } else if (gameState === "game_over_menu") {
        if (isInsideButton(x, y, restartButton)) {
          resetGame(selectedLevelName);
        } else if (isInsideButton(x, y, otherModeButton)) {
          selectedLevel = null;
          selectedLevelName = "";
          particles = [];
          gameOverIsotope = "";
          gameOverElapsedSeconds = 0;
          nextParalysisCheckAt = 0;
          paralysisUntil = 0;
          gameState = "menu";
          setMobileControlsActive(false);
        }
      }
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
